<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redes sociales</title>
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.6.3/css/all.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        height: 100vh;
        background: #000000;
      }

      ul {
        display: flex;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      ul li {
        list-style: none;
      }

      ul li a {
        width: 80px;
        height: 80px;
        background-color: #fff;
        text-align: center;
        line-height: 80px;
        font-size: 35px;
        margin: 0 10px;
        display: block;
        border-radius: 50%;
        position: relative;
        overflow: hidden;
        border: 3px solid #fff;
      }

      ul li a .icono {
        position: relative;
        color: #363636;
        transition: 0.5s;
        z-index: 2;
      }

      ul li a:hover .icono {
        color: #fff;
        transform: rotateY(360deg);
      }

      ul li a:before {
        content: "";
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        height: 100%;
        transition: 0.5s;
      }

      ul li a:hover:before {
        top: 0;
      }

      ul li:nth-child(1) a:before {
        background: #3b5999;
      }

      ul li:nth-child(2) a:before {
        background: #55acee;
      }

      ul li:nth-child(3) a:before {
        background: #0077b5;
      }

      ul li:nth-child(4) a:before {
        background: #dd4b39;
      }
    </style>
  </head>
  <body>
    <ul>
      <li>
        <a href="#"> <i class="fab fa-facebook-f icono"></i> </a>
      </li>
      <li>
        <a href="#"><i class="fab fa-twitter icono"></i></a>
      </li>
      <li>
        <a href="#"><i class="fab fa-linkedin-in icono"></i></a>
      </li>
      <li>
        <a href="#"><i class="fab fa-google-plus-g icono"></i></a>
      </li>
    </ul>
  </body>
</html>
