<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cambiar contraseña</title>
  <style>
    
    body { 
        font-family: Arial, Helvetica, sans-serif; 
        padding: 20px; 
        background: #fff; }
    .form-box { 
        max-width: 420px; 
        margin: 24px auto; 
        padding: 12px; 
        border: 1px solid #ccc; 
        background: #fff; }
    label { 
        display: block; 
        margin-top: 10px; 
        font-weight: normal; }
    input[type=password] { 
        width: 100%; 
        padding: 6px; 
        margin-top: 6px; 
        border: 1px solid #ccc; }
  .acciones { 
    margin-top: 12px; 
    text-align: right; }
  .boton { 
    padding: 6px 10px; 
    border: 1px solid #999; 
    background: #eee; 
    cursor: pointer; }
  .boton-primario { 
    background: #ddd; }
  </style>
</head>
<body>
  <div class="form-box">
    <h2>Cambiar contraseña</h2>
    <form id="changeForm" action="CambiarContraseña.php" method="post">
      <label for="old">Contraseña actual</label>
      <input type="password" id="old" name="old_password" required>

      <label for="new">Nueva contraseña</label>
      <input type="password" id="new" name="new_password" required>

      <label for="new2">Repetir nueva contraseña</label>
      <input type="password" id="new2" name="new_password2" required>

      <div class="acciones">
        <a class="boton" href="main.php">Cancelar</a>
        <button class="boton boton-primario" type="submit">Cambiar</button>
      </div>
    </form>
  </div>
  <script>
   
    document.getElementById('changeForm').addEventListener('submit', function(e){
      const n1 = document.getElementById('new').value;
      const n2 = document.getElementById('new2').value;
      if (n1 !== n2){
        e.preventDefault();
        alert('Las nuevas contraseñas no coinciden.');
        document.getElementById('new').focus();
        return false;
      }
    });
  </script>
</body>
</html>
