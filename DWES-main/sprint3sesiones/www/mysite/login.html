<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
</head>
<body>
    <form id="loginForm" action="login.php" method="post">
        <label for="email">Usuario: </label>
        <input type="email" id="email" name="email"><br>
        <label for="contraseña">Contraseña: </label>
        <input type="password" id="contraseña" name="contraseña"/><br>
        <input type="submit" id="submitBtn" value="Iniciar sesión">
    </form>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(evento) {
            let email = document.getElementById('email').value.trim();
            let pass = document.getElementById('contraseña').value;
            if (email === '' || pass === '') {
                evento.preventDefault();
                alert('Rellena todos los campos antes de iniciar sesión.');                
            }
        });
    </script>
</body>
</html>
